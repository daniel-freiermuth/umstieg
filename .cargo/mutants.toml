# cargo-mutants: CI gates pull requests on the mutants in their diff
# (`just mutants-diff`); `just mutants` runs everything. A missed mutant fails,
# and so does a timeout: the gate can't tell a hang from a test too slow to finish.
test_tool = "nextest"
exclude_globs = ["src/*_tests.rs", "src/testkit.rs"]
# Fail fast, end-to-end tests last: see the mutants profile in .config/nextest.toml.
additional_cargo_test_args = ["--profile=mutants"]
# Floor under the auto-set test timeout (20s locally on a 2s baseline), so a
# mutant caught on a loaded CI runner isn't reported as a timeout.
minimum_test_timeout = 60
# Equivalent mutants: same results, at most slower. Each with why.
exclude_re = [
  # Re-offering an equal value never settles the scan (earliest_arrival,
  # lower_bounds, fastest_journeys share improve): hangs, wasting the timeout.
  'replace improve -> bool with true$',
  'replace < with (==|<=) in improve$',
  # At pop time d >= best, so this only stops skipping stale heap entries, which
  # can't improve anything. (The Dijkstra lives in shortest_paths since ccf9503.)
  'replace > with < in shortest_paths$',
  # Pushes a second entry with the same departure instead of overwriting; lookups take the last one.
  'replace match guard last\.0 == r\.departure with false in fastest_journeys',
  # settle with `||` repeats a pass that reports changes forever (a chunk with a
  # zero-time ride in fastest_journeys), and otherwise until a pass changes
  # nothing, which leaves the same profiles: an equal goal is no improvement and
  # an equal profile entry returns early. The mutant only hangs.
  'enumerate\.rs:\d+:\d+: replace && with \|\| in settle$',
  # Recomputes fastest_with(missed_by <= 0), or the search for the fastest with
  # it: the same or a stricter search that already found nothing.
  'replace match guard limits\.missed_by > TimeDelta::zero\(\) with true in enumerate_reporting$',
  'replace > with >= in enumerate_reporting$',
  # Lists again with the limit just used: the same list.
  'replace match guard f == fastest_duration with false in enumerate_reporting$',
  # Riding a train past the deadline stops at its first stop: no node, no chain.
  "replace match guard departure > d with false in Search<'_>::explore",
  # presence is empty exactly when no ride was taken, so this arm can't match then.
  "replace match guard !first with true in Search<'_>::explore",
  # Defers to `record` what `detour` prunes at boarding: with --forward-only,
  # every such alternative; without, those from an earlier stop closer by the
  # best case. `record` prunes every chain using one all the same (it arrives
  # by the deadline and, with --forward-only, leaves the train where less
  # remains than where it boards, so than at the earlier stop): same results, slower.
  "replace \\|\\| with && in Search<'_>::detour$",
  # Only a nonzero b overflows, so b == 0 never decides the saturation side.
  'replace < with <= in sum',
  'replace > with >= in difference',
  # A cache file exactly ttl old to the nanosecond can't be produced.
  'replace < with <= in DiskCache::get_or_fetch',
  # Bearings from coordinates are never exactly SAME_DIRECTION_DEGREES apart.
  'replace > with >= in change_points$',
  # On equal times, clamping to the previous time assigns the same value.
  'replace < with <= in propagate_delays',
  # A stop of the other copy at the very time of the first or last known call
  # is at another station: a train isn't at two at once.
  'replace < with <= in add_stops',
  # Progress reports: tests report at every state (stride 1, no interval), so
  # the production stride and the clock check can't change what tests see.
  'enumerate\.rs:\d+:\d+: replace << with >>',
  "replace && with \\|\\| in Search<'_>::report_due",
  "replace Search<'_>::report_due -> bool with true",
  # A stop missing from one copy at the very time of a stop both have: a train
  # isn't at two stations at once, so the anchors around it don't change.
  'replace < with <= in anchored$',
  'replace > with >= in anchored$',
  # A stop only one copy lists, at the very time of the first or last stop both
  # list, is at another station: a train isn't at two at once.
  'replace < with <= in own_stops$',
  'replace > with >= in own_stops$',
  # A stop at the very time of the new start is the new start itself: a train
  # isn't at two stations at once, and the route it was cut short to doesn't
  # reach the station it starts again at.
  'replace < with <= in last_call_on$',
  # A stop at the very time of the departure ends the train there, as does
  # finding none after it: the departure's time either way.
  'replace > with >= in last_call_on$',
]
