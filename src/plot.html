<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>umstieg</title>
<style>
  :root {
    --bg: #fff; --fg: #1d2129; --muted: #6b7280; --grid: #e5e7eb; --wait: #9ca3af;
    --panel: #f8fafc; --accent: #d97706; --warn: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --fg: #e5e7eb; --muted: #9ca3af; --grid: #2a2f37; --wait: #6b7280;
            --panel: #181c22; --accent: #f59e0b; --warn: #f87171; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--fg);
         display: grid; grid-template-columns: 1fr 320px; grid-template-rows: auto 1fr; height: 100vh; }
  header { grid-column: 1 / 3; padding: 10px 16px; border-bottom: 1px solid var(--grid); position: relative; }
  header h1 { font-size: 16px; margin: 0; }
  header p { margin: 2px 0 0; color: var(--muted); }
  #reset { position: absolute; right: 16px; top: 12px; font: inherit; padding: 3px 10px; border-radius: 4px;
           border: 1px solid var(--grid); background: var(--panel); color: var(--fg); cursor: pointer; }
  #plot { position: relative; overflow: hidden; cursor: grab; user-select: none; }
  #plot:active { cursor: grabbing; }
  aside { border-left: 1px solid var(--grid); background: var(--panel); overflow: auto; padding: 10px 12px; }
  aside h2 { font-size: 13px; margin: 10px 0 6px; color: var(--muted); font-weight: 600; }
  .group { display: flex; align-items: center; gap: 6px; padding: 2px 4px; border-radius: 4px; cursor: pointer; }
  .group:hover { background: var(--grid); }
  .group.off { opacity: .35; }
  .count { margin-left: auto; color: var(--muted); }
  #details { white-space: pre-wrap; font-size: 12px; }
  #details .fb { color: var(--accent); }
  #tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--grid);
         border-radius: 6px; padding: 6px 8px; max-width: 560px; font-size: 12px; display: none;
         box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  #tip b { display: block; }
  svg { display: block; }
  .axis text, .station text { fill: var(--muted); font-size: 11px; }
  .axis line { stroke: var(--grid); }
  .station line { stroke: var(--grid); stroke-dasharray: 2 3; }
  .station .leader { fill: none; stroke-width: 1; }
  /* Base: every stretch drawn once, rides coloured by train. */
  .base .ride, .overlay .ride { fill: none; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
  .base .wait, .overlay .wait { fill: none; stroke: var(--wait); stroke-width: 1; }
  .base .warn, .overlay .warn { stroke: var(--warn); }
  .base .walk, .overlay .walk { fill: none; stroke: var(--wait); stroke-width: 1; stroke-dasharray: 3 3; }
  svg.focus .base { opacity: .15; }
  /* Overlay: the previewed connections, and the selected one thick. */
  .overlay .ride { stroke-width: 2.4; }
  .overlay .wait, .overlay .walk { stroke-width: 1.6; }
  .overlay .strong.ride { stroke-width: 4.5; }
  .overlay .strong.wait { stroke-width: 3; }
  /* Other listed connections recede behind the selected / previewed one. */
  .overlay .faded { opacity: .3; }
  .overlay, .fallback, .change-labels { pointer-events: none; }
  .fallback .ride { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 7 4; }
  .fallback .wait, .fallback .walk { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 2 3; }
  .hit { fill: none; stroke: transparent; stroke-width: 9; pointer-events: stroke; }
  .change-labels text { fill: var(--fg); font-size: 11px; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; }
  .hover-piece { fill: none; stroke: var(--fg); stroke-width: 7; stroke-opacity: .3; stroke-linecap: round; pointer-events: none; }
  .candidate { padding: 4px 6px; border-radius: 4px; cursor: pointer; }
  .candidate:hover, .candidate.on { background: var(--grid); }
  .candidate .route { color: var(--muted); font-size: 11px; }
  .back { color: var(--accent); cursor: pointer; display: block; margin-bottom: 6px; }
  kbd { font: 11px monospace; border: 1px solid var(--grid); border-radius: 3px; padding: 0 3px; }
</style>
</head>
<body>
<header><h1 id="title"></h1><p id="subtitle"></p><button id="reset" title="Or double-click the plot">Reset zoom</button></header>
<div id="plot"><div id="tip"></div></div>
<aside>
  <h2 id="panel-title">Selection</h2>
  <div id="details"></div>
  <h2>First … last train (hover to highlight, click to hide)</h2>
  <div id="groups"></div>
  <h2>Reading the plot</h2>
  <div id="legend"></div>
</aside>
<script>
const D = /*__DATA__*/null;
const NS = "http://www.w3.org/2000/svg";
const plotEl = document.getElementById("plot");
const tip = document.getElementById("tip");
const details = document.getElementById("details");
const panelTitle = document.getElementById("panel-title");
const timeFmt = new Intl.DateTimeFormat(undefined, { hour: "2-digit", minute: "2-digit", hourCycle: "h23", timeZone: D.tz });
// One colour per train, so a train can be followed across all connections.
const trainColor = t => `hsl(${(t * 137.508) % 360}, 70%, 45%)`;
const HINT = "Hover a line to see which connections use it. Click it to select: a line used by one connection " +
  "selects that connection, a shared line lists all connections using it.";

// Interaction state. Selection only changes on click; hovering only previews.
const hidden = new Set();   // hidden groups
let pinned = null;          // selected connection
let candidates = null;      // connections using the clicked line: { piece, chains }
let hoverTarget = null;     // line under the mouse: { info, chains, pts }
let preview = null;         // connection hovered in the candidate list
let softGroup = null;       // group hovered in the group list

document.getElementById("title").textContent = D.title;
document.getElementById("subtitle").textContent = D.subtitle;
document.getElementById("legend").innerHTML =
  `x: time (${D.tz}). y: ${D.metric} (${D.unit}), goal at the bottom.<br>` +
  `Coloured: riding, one colour per train · thin grey: waiting (red: below minimum transfer) · dotted: walking.<br>` +
  `Parallel lines: same route later. Steeper: faster. Dashed orange: fallbacks of the selection.<br>` +
  `<kbd>↑</kbd> <kbd>↓</kbd> step through listed connections, <kbd>Esc</kbd> clears the selection.<br>` +
  `Wheel: zoom (<kbd>Shift</kbd> time only, <kbd>Alt</kbd> height only) · drag: pan · double-click: reset.`;

function el(name, attrs, parent) {
  const e = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}
function esc(s) {
  return s.replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
}

// Points come as (unix minutes, height × 100, station); pieces and fallbacks by index.
for (const p of D.pieces) p.pts = p.pts.map(([m, h, s]) => [m * 60e3, h / 100, s]);
for (const f of D.fallbacks) f.pieces = f.pieces.map(i => D.pieces[i]);
for (const c of D.chains) c.fallbacks = c.fallbacks.map(([i, arrive]) => ({ ...D.fallbacks[i], arrive }));

// Full extent of the connections; fallbacks reaching beyond are clipped.
const full = { t0: Infinity, t1: -Infinity, y0: 0, y1: 0 };
for (const c of D.chains) for (const i of c.pieces)
  for (const [t, v] of D.pieces[i].pts) {
    full.t0 = Math.min(full.t0, t); full.t1 = Math.max(full.t1, t); full.y1 = Math.max(full.y1, v);
  }
full.t0 -= 10 * 60e3; full.t1 += 10 * 60e3;
let dom = { ...full };     // visible part: zoomed and panned
let model = null;          // shared stretches of the visible connections
let view = null;           // per-render drawing context
let geom = null;           // plot area of the last render

// The smallest shared units, each drawn once and used as hover target, so
// every connection passing through counts, wherever it boards or leaves:
//   rides: one per train and stop-to-stop stretch,
//   waits: by station and time under the mouse,
//   walks: per walk.
// Depends only on which groups are hidden, not on zoom.
function buildModel() {
  const edges = new Map(), waits = new Map(), walks = new Map(), warns = new Set();
  D.chains.forEach((c, i) => {
    if (hidden.has(c.group)) return;
    for (const pi of c.pieces) {
      const p = D.pieces[pi];
      if (p.kind === "ride") {
        for (let k = 1; k < p.pts.length; k++) {
          const [a, b] = [p.pts[k - 1], p.pts[k]];
          const key = `${p.trip}:${a[0]}:${a[2]}:${b[0]}:${b[2]}`;
          if (!edges.has(key)) {
            const info = a[2] === b[2]
              ? `${D.trips[p.trip]} · stop at ${D.names[a[2]]} ${timeFmt.format(a[0])}–${timeFmt.format(b[0])}`
              : `${D.trips[p.trip]} · ${timeFmt.format(a[0])} ${D.names[a[2]]} → ${timeFmt.format(b[0])} ${D.names[b[2]]}`;
            edges.set(key, { trip: p.trip, pts: [a, b], info, chains: new Set() });
          }
          edges.get(key).chains.add(i);
        }
      } else if (p.kind === "wait" && p.pts.length) {
        const s = p.pts[0][2];
        if (!waits.has(s)) waits.set(s, { y: p.pts[0][1], spans: [], pieces: new Set() });
        waits.get(s).spans.push({ from: p.pts[0][0], to: p.pts[p.pts.length - 1][0], chain: i });
        waits.get(s).pieces.add(pi);
        if (p.warn) warns.add(pi);
      } else if (p.kind === "walk") {
        if (!walks.has(pi)) walks.set(pi, new Set());
        walks.get(pi).add(i);
      }
    }
  });
  // Overlapping waits at a station merge into one line per continuous stay.
  for (const w of waits.values()) {
    const sorted = [...w.spans].sort((a, b) => a.from - b.from);
    w.runs = [];
    let [from, to] = [sorted[0].from, sorted[0].to];
    for (const s of sorted.slice(1)) {
      if (s.from > to) { w.runs.push([from, to]); [from, to] = [s.from, s.to]; } else to = Math.max(to, s.to);
    }
    w.runs.push([from, to]);
  }
  // Hover targets, looked up by index from a single set of event listeners.
  const targets = [];
  for (const e of edges.values()) {
    const t = { info: e.info, trip: e.trip, chains: [...e.chains], pts: e.pts };
    targets.push({ pts: e.pts, at: () => t });
  }
  for (const [s, { spans, pieces }] of waits) {
    for (const pi of pieces) {
      const piece = D.pieces[pi];
      targets.push({ pts: piece.pts, at: time => {
        const chains = [...new Set(spans.filter(w => w.from <= time && time <= w.to).map(w => w.chain))];
        return { info: `waiting at ${D.names[s]} · ${timeFmt.format(time)}`, chains, pts: piece.pts };
      } });
    }
  }
  for (const [pi, chains] of walks) {
    const t = { info: D.pieces[pi].info, chains: [...chains], pts: D.pieces[pi].pts };
    targets.push({ pts: t.pts, at: () => t });
  }
  model = { edges: [...edges.values()], waits: [...waits.values()], walks: [...walks.keys()], warns: [...warns], targets };
}

function render() {
  plotEl.querySelectorAll("svg").forEach(s => s.remove());
  const W = plotEl.clientWidth, H = plotEl.clientHeight;
  const m = { l: 240, r: 16, t: 14, b: 28 };
  geom = { W, H, m };
  const x = t => m.l + (t - dom.t0) / (dom.t1 - dom.t0) * (W - m.l - m.r);
  const y = v => m.t + (dom.y1 - v) / (dom.y1 - dom.y0 || 1) * (H - m.t - m.b);
  const svg = el("svg", { width: W, height: H });
  plotEl.insertBefore(svg, tip);
  const clip = el("clipPath", { id: "area" }, el("defs", {}, svg));
  el("rect", { x: m.l, y: m.t - 6, width: W - m.l - m.r, height: H - m.b - m.t + 6 }, clip);

  // Station bands, alternating hue, so neighbouring stations are told apart.
  // Hue follows the station, not its position, so it stays put when zooming.
  const hue = i => (i * 47) % 360;
  const st = D.stations.map((s, i) => ({ ...s, i, py: y(s.y) }))
    .filter(s => s.py >= m.t - 1 && s.py <= H - m.b + 1);
  const bands = el("g", { "clip-path": "url(#area)" }, svg);
  st.forEach((s, k) => {
    const above = k > 0 ? (st[k - 1].py + s.py) / 2 : m.t;
    const below = k < st.length - 1 ? (s.py + st[k + 1].py) / 2 : H - m.b;
    el("rect", { x: m.l, y: above, width: W - m.l - m.r, height: Math.max(0, below - above),
                 fill: `hsl(${hue(s.i)}, 60%, 50%)`, "fill-opacity": 0.05 }, bands);
  });

  // Every visible station gets a label: labels of nearby stations are pushed
  // apart and joined to their row by a leader line in the row's band colour.
  const gap = Math.min(12, (H - m.t - m.b) / Math.max(1, st.length));
  const at = st.map(s => s.py);
  for (let k = 1; k < at.length; k++) at[k] = Math.max(at[k], at[k - 1] + gap);
  if (at.length && at[at.length - 1] > H - m.b) {
    at[at.length - 1] = H - m.b;
    for (let k = at.length - 2; k >= 0; k--) at[k] = Math.min(at[k], at[k + 1] - gap);
  }
  const stations = el("g", { class: "station" }, svg);
  st.forEach((s, k) => {
    el("line", { x1: m.l, x2: W - m.r, y1: s.py, y2: s.py }, stations);
    el("polyline", { points: `${m.l - 26},${at[k]} ${m.l - 8},${s.py} ${m.l},${s.py}`, class: "leader",
                     stroke: `hsl(${hue(s.i)}, 60%, 50%)` }, stations);
    const t = el("text", { x: m.l - 30, y: at[k] + gap / 3, "text-anchor": "end",
                           "font-size": Math.min(11, gap) }, stations);
    t.textContent = s.name.length > 32 ? s.name.slice(0, 31) + "…" : s.name;
    el("title", {}, t).textContent = s.name;
  });

  // Time ticks: the coarsest step that still gives about ten labels.
  const axis = el("g", { class: "axis" }, svg);
  const steps = [5, 10, 15, 30, 60, 120, 180, 360].map(mins => mins * 60e3);
  const step = steps.find(s => (dom.t1 - dom.t0) / s <= 12) ?? steps[steps.length - 1];
  for (let t = Math.ceil(dom.t0 / step) * step; t <= dom.t1; t += step) {
    el("line", { x1: x(t), x2: x(t), y1: m.t, y2: H - m.b }, axis);
    el("text", { x: x(t), y: H - 10, "text-anchor": "middle" }, axis).textContent = timeFmt.format(t);
  }

  const pts = p => p.pts.map(([t, v]) => `${x(t).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const base = el("g", { class: "base", "clip-path": "url(#area)" }, svg);
  for (const e of model.edges) el("polyline", { points: pts(e), class: "ride", stroke: trainColor(e.trip) }, base);
  for (const w of model.waits) {
    for (const [from, to] of w.runs) el("polyline", { points: pts({ pts: [[from, w.y], [to, w.y]] }), class: "wait" }, base);
  }
  for (const pi of model.warns) el("polyline", { points: pts(D.pieces[pi]), class: "wait warn" }, base);
  for (const pi of model.walks) el("polyline", { points: pts(D.pieces[pi]), class: "walk" }, base);
  const overlay = el("g", { class: "overlay", "clip-path": "url(#area)" }, svg);

  const hits = el("g", { "clip-path": "url(#area)" }, svg);
  model.targets.forEach((t, i) => el("polyline", { points: pts(t), class: "hit", "data-t": i }, hits));
  const targetAt = e => {
    const i = e.target.dataset?.t;
    if (i === undefined) return null;
    const time = dom.t0 + (e.clientX - svg.getBoundingClientRect().left - m.l) / (W - m.l - m.r) * (dom.t1 - dom.t0);
    return model.targets[i].at(time);
  };
  hits.addEventListener("mousemove", e => { if (drag) return; hoverTarget = targetAt(e); refresh(); moveTip(e); });
  hits.addEventListener("mouseout", () => { hoverTarget = null; refresh(); });
  hits.addEventListener("click", e => {
    e.stopPropagation();
    if (dragged) return;
    const t = targetAt(e);
    if (t) choose(t);
  });

  const hoverLayer = el("g", { "clip-path": "url(#area)" }, svg);
  const fbLayer = el("g", { class: "fallback", "clip-path": "url(#area)" }, svg);
  const labels = el("g", { class: "change-labels", "clip-path": "url(#area)" }, svg);
  svg.addEventListener("click", () => { if (dragged) return; pinned = null; candidates = null; refresh(); });

  view = { svg, x, y, pts, overlay, hoverLayer, fbLayer, labels, overlayKey: null };
  refresh();
}

// Zoom and pan: wheel zooms around the mouse (Shift: time only, Alt: height
// only), dragging pans, double-click or the button resets.
let frame = null;
function scheduleRender() {
  if (frame === null) frame = requestAnimationFrame(() => { frame = null; render(); });
}
function clampDomain() {
  const minT = 10 * 60e3, minY = (full.y1 - full.y0) / 200;
  if (dom.t1 - dom.t0 < minT) { const c = (dom.t0 + dom.t1) / 2; dom.t0 = c - minT / 2; dom.t1 = c + minT / 2; }
  if (dom.y1 - dom.y0 < minY) { const c = (dom.y0 + dom.y1) / 2; dom.y0 = c - minY / 2; dom.y1 = c + minY / 2; }
  const span = (lo, hi, a, b) => {
    // Never wider than everything, and never off it.
    if (hi - lo > b - a) return [a, b];
    if (lo < a) return [a, a + hi - lo];
    if (hi > b) return [b - (hi - lo), b];
    return [lo, hi];
  };
  [dom.t0, dom.t1] = span(dom.t0, dom.t1, full.t0, full.t1);
  [dom.y0, dom.y1] = span(dom.y0, dom.y1, full.y0, full.y1);
}
function mouseInPlot(e) {
  const r = plotEl.getBoundingClientRect(), { W, H, m } = geom;
  const px = e.clientX - r.left, py = e.clientY - r.top;
  return { px, py, fx: (px - m.l) / (W - m.l - m.r), fy: (py - m.t) / (H - m.t - m.b) };
}
plotEl.addEventListener("wheel", e => {
  e.preventDefault();
  const { fx, fy } = mouseInPlot(e);
  const k = Math.exp(e.deltaY * 0.0015);
  if (!e.altKey) {
    const at = dom.t0 + fx * (dom.t1 - dom.t0);
    dom.t0 = at - (at - dom.t0) * k; dom.t1 = at + (dom.t1 - at) * k;
  }
  if (!e.shiftKey) {
    const at = dom.y1 - fy * (dom.y1 - dom.y0);
    dom.y0 = at - (at - dom.y0) * k; dom.y1 = at + (dom.y1 - at) * k;
  }
  clampDomain();
  scheduleRender();
}, { passive: false });
let drag = null, dragged = false;
plotEl.addEventListener("mousedown", e => {
  if (e.button !== 0) return;
  drag = { x: e.clientX, y: e.clientY, dom: { ...dom } };
  dragged = false;
});
window.addEventListener("mousemove", e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!dragged && Math.hypot(dx, dy) < 4) return;
  dragged = true;
  tip.style.display = "none";
  const { W, H, m } = geom;
  const dt = dx / (W - m.l - m.r) * (drag.dom.t1 - drag.dom.t0);
  const dv = dy / (H - m.t - m.b) * (drag.dom.y1 - drag.dom.y0);
  dom = { t0: drag.dom.t0 - dt, t1: drag.dom.t1 - dt, y0: drag.dom.y0 + dv, y1: drag.dom.y1 + dv };
  clampDomain();
  scheduleRender();
});
window.addEventListener("mouseup", () => {
  drag = null;
  // The click that ends a drag must not select or clear; let it pass first.
  if (dragged) setTimeout(() => { dragged = false; }, 0);
});
plotEl.addEventListener("dblclick", () => { dom = { ...full }; scheduleRender(); });
document.getElementById("reset").addEventListener("click", () => { dom = { ...full }; scheduleRender(); });


// Clicking a line: one connection selects it, several are listed to choose from.
function choose(target) {
  if (!target.chains.length) return;
  if (target.chains.length === 1) { candidates = null; pinned = target.chains[0]; }
  else { candidates = { info: target.info, chains: target.chains }; pinned = target.chains.includes(pinned) ? pinned : null; }
  refresh();
}

function refresh() {
  if (!view) return;
  const { svg, x, y, pts, overlay, hoverLayer, fbLayer, labels } = view;
  const strong = [pinned, preview].filter(i => i !== null);
  // Hovered stretch and hovered group show at full strength; the rest of a
  // clicked list recedes once one of its connections is selected or previewed.
  const soft = new Set(), faded = new Set();
  if (hoverTarget) hoverTarget.chains.forEach(i => soft.add(i));
  if (softGroup !== null) D.chains.forEach((c, i) => { if (c.group === softGroup && !hidden.has(c.group)) soft.add(i); });
  if (candidates) candidates.chains.forEach(i => (strong.length ? faded : soft).add(i));
  svg.classList.toggle("focus", strong.length > 0 || soft.size > 0 || faded.size > 0);

  // Overlay: previewed connections in train colours, the selection thick on top.
  // Redrawn only when the set changes, not on every mouse move.
  const key = JSON.stringify([strong, [...soft].sort((a, b) => a - b), [...faded].sort((a, b) => a - b)]);
  if (key !== view.overlayKey) {
    view.overlayKey = key;
    overlay.replaceChildren();
    const draw = (pi, cls) => {
      const p = D.pieces[pi];
      const line = el("polyline", { points: pts(p), class: `${p.kind}${p.warn ? " warn" : ""} ${cls}` }, overlay);
      if (p.kind === "ride") line.setAttribute("stroke", trainColor(p.trip));
    };
    const mine = new Set(strong.flatMap(i => D.chains[i].pieces));
    const shown = new Set(mine);
    const pieces = chains => new Set([...chains].flatMap(i => D.chains[i].pieces).filter(pi => !shown.has(pi)));
    const bright = pieces(soft);
    bright.forEach(pi => shown.add(pi));
    for (const pi of pieces(faded)) draw(pi, "soft faded");
    for (const pi of bright) draw(pi, "soft");
    for (const pi of mine) draw(pi, "strong");
  }

  hoverLayer.replaceChildren();
  if (hoverTarget) el("polyline", { points: pts(hoverTarget), class: "hover-piece" }, hoverLayer);

  fbLayer.replaceChildren();
  labels.replaceChildren();
  const focus = preview ?? pinned;
  if (focus !== null) {
    if (focus === pinned) for (const f of D.chains[pinned].fallbacks) {
      const g = el("g", {}, fbLayer);
      for (const p of f.pieces) el("polyline", { points: pts(p), class: p.kind }, g);
    }
    // Name the changes: their station rows are often too close to tell apart.
    for (const p of D.chains[focus].pieces.map(i => D.pieces[i]).filter(p => p.kind === "wait" && p.pts.length)) {
      const [t, v] = p.pts[0];
      el("text", { x: x(t) + 4, y: y(v) - 5 }, labels).textContent = p.info;
    }
  }

  if (hoverTarget) {
    const { info, chains, trip } = hoverTarget;
    const swatch = trip === undefined ? "" : `<span style="color:${trainColor(trip)}">■</span> `;
    let who;
    if (chains.length === 1) {
      const c = D.chains[chains[0]];
      who = `<br><b>${esc(c.header)}</b><span style="color:var(--muted)">${esc(c.route)}</span>`;
    } else {
      const groups = new Map();
      for (const i of chains) groups.set(D.chains[i].group, (groups.get(D.chains[i].group) || 0) + 1);
      const list = [...groups].sort((a, b) => b[1] - a[1])
        .map(([g, n]) => `• ${esc(D.groups[g].label)} (${n})`).join("<br>");
      who = `<br><span style="color:var(--muted)">${chains.length} connections in ${groups.size} group${groups.size > 1 ? "s" : ""} · click to list them</span><br>${list}`;
    }
    tip.innerHTML = `<b>${swatch}${esc(info)}</b>${who}`;
    tip.style.display = "block";
  } else {
    tip.style.display = "none";
  }
  renderPanel();
}

function moveTip(e) {
  const r = plotEl.getBoundingClientRect();
  tip.style.left = Math.min(e.clientX - r.left + 14, r.width - tip.offsetWidth - 8) + "px";
  tip.style.top = (e.clientY - r.top + 14) + "px";
}

let panelKey = null; // avoid rebuilding the panel (and losing its hover) on every mouse move
function renderPanel() {
  const key = JSON.stringify([pinned, candidates && candidates.info, candidates && candidates.chains.length]);
  if (key === panelKey) return;
  panelKey = key;
  if (pinned !== null) {
    panelTitle.textContent = "Selected connection";
    const c = D.chains[pinned];
    let html = candidates
      ? `<span class="back" id="back">← ${candidates.chains.length} connections using ${esc(candidates.info)}</span>`
      : "";
    html += `<b>${esc(c.header)}</b>\n${esc(c.route).replaceAll(" ‖", "\n‖").replaceAll("‖ ", "‖\n")}`;
    let at = null;
    for (const f of c.fallbacks) {
      if (f.at !== at) { html += `\n\n<span class="fb">If the change at ${esc(f.at)} is missed:</span>`; at = f.at; }
      html += `\n<span class="fb">• ${esc(f.line)} · arrive ${esc(f.arrive)}</span>`;
    }
    details.innerHTML = html;
    document.getElementById("back")?.addEventListener("click", () => { pinned = null; refresh(); });
  } else if (candidates) {
    panelTitle.textContent = `${candidates.chains.length} connections use ${candidates.info}`;
    details.replaceChildren();
    for (const i of candidates.chains) {
      const c = D.chains[i];
      const row = document.createElement("div");
      row.className = "candidate";
      row.innerHTML = `<b>${esc(c.header)}</b><div class="route">${esc(c.route)}</div>`;
      row.addEventListener("mouseenter", () => { preview = i; refresh(); });
      row.addEventListener("mouseleave", () => { preview = null; refresh(); });
      row.addEventListener("click", () => { preview = null; pinned = i; refresh(); });
      details.appendChild(row);
    }
  } else {
    panelTitle.textContent = "Selection";
    details.textContent = HINT;
  }
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape") { pinned = null; candidates = null; preview = null; refresh(); return; }
  if (!candidates || (e.key !== "ArrowDown" && e.key !== "ArrowUp")) return;
  e.preventDefault();
  const list = candidates.chains;
  const now = list.indexOf(pinned);
  const next = now < 0 ? 0 : (now + (e.key === "ArrowDown" ? 1 : list.length - 1)) % list.length;
  pinned = list[next];
  refresh();
});

const groupsEl = document.getElementById("groups");
D.groups.forEach((g, i) => {
  const row = document.createElement("div");
  row.className = "group";
  row.innerHTML = `<span>${esc(g.label)}</span><span class="count">${g.count}</span>`;
  row.addEventListener("mouseenter", () => { softGroup = hidden.has(i) ? null : i; refresh(); });
  row.addEventListener("mouseleave", () => { softGroup = null; refresh(); });
  row.addEventListener("click", () => {
    hidden.has(i) ? hidden.delete(i) : hidden.add(i);
    row.classList.toggle("off", hidden.has(i));
    softGroup = null;
    if (pinned !== null && D.chains[pinned].group === i) pinned = null;
    if (candidates) {
      candidates.chains = candidates.chains.filter(c => !hidden.has(D.chains[c].group));
      if (!candidates.chains.length) candidates = null;
    }
    panelKey = null;
    buildModel();
    render();
  });
  groupsEl.appendChild(row);
});

buildModel();
new ResizeObserver(render).observe(plotEl);
</script>
</body>
</html>
