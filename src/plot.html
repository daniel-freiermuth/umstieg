<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>umstieg</title>
<style>
  :root {
    --bg: #fff; --fg: #1d2129; --muted: #6b7280; --grid: #e5e7eb; --wait: #9ca3af;
    --panel: #f8fafc; --accent: #d97706; --warn: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --fg: #e5e7eb; --muted: #9ca3af; --grid: #2a2f37; --wait: #6b7280;
            --panel: #181c22; --accent: #f59e0b; --warn: #f87171; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--fg);
         display: grid; grid-template-columns: 1fr 320px; grid-template-rows: auto 1fr; height: 100vh; }
  header { grid-column: 1 / 3; padding: 10px 16px; border-bottom: 1px solid var(--grid); }
  header h1 { font-size: 16px; margin: 0; }
  header p { margin: 2px 0 0; color: var(--muted); }
  #plot { position: relative; overflow: hidden; }
  aside { border-left: 1px solid var(--grid); background: var(--panel); overflow: auto; padding: 10px 12px; }
  aside h2 { font-size: 13px; margin: 10px 0 6px; color: var(--muted); font-weight: 600; }
  .group { display: flex; align-items: center; gap: 6px; padding: 2px 4px; border-radius: 4px; cursor: pointer; }
  .group:hover { background: var(--grid); }
  .group.off { opacity: .35; }
  .swatch { width: 14px; height: 4px; border-radius: 2px; flex: none; }
  .count { margin-left: auto; color: var(--muted); }
  #details { white-space: pre-wrap; font-size: 12px; }
  #details .fb { color: var(--accent); }
  #tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--grid);
         border-radius: 6px; padding: 6px 8px; max-width: 560px; font-size: 12px; display: none;
         box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  #tip b { display: block; }
  svg { display: block; }
  .axis text, .station text { fill: var(--muted); font-size: 11px; }
  .axis line { stroke: var(--grid); }
  .station line { stroke: var(--grid); stroke-dasharray: 2 3; }
  .station .leader { fill: none; stroke-width: 1; }
  .chain .ride { fill: none; stroke-width: 1.6; stroke-opacity: .45; stroke-linejoin: round; }
  .chain .wait { fill: none; stroke: var(--wait); stroke-width: 1; stroke-opacity: .6; }
  .chain .wait.warn { stroke: var(--warn); }
  .chain .walk { fill: none; stroke: var(--wait); stroke-width: 1; stroke-dasharray: 3 3; }
  .chain.off { display: none; }
  /* Hundreds of overlapping lines add up: dim to grey, not just transparent. */
  svg.focus .chain:not(.hl):not(.soft) { opacity: .25; }
  svg.focus .chain:not(.hl):not(.soft) .ride { stroke: var(--grid) !important; stroke-opacity: 1; }
  svg.focus .chain:not(.hl):not(.soft) .wait, svg.focus .chain:not(.hl):not(.soft) .walk { stroke: var(--grid); }
  .chain.hl .ride { stroke-width: 3.5; stroke-opacity: 1; }
  .chain.hl .wait { stroke-width: 2.5; stroke-opacity: 1; }
  .fallback .ride { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 7 4; }
  .fallback .wait, .fallback .walk { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 2 3; }
  .hit { fill: none; stroke: transparent; stroke-width: 9; pointer-events: stroke; }
  .fallback, .change-labels { pointer-events: none; }
  .change-labels text { fill: var(--fg); font-size: 11px; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; }
  svg.focus .chain.soft { opacity: 1; }
  svg.focus .chain.soft .ride { stroke-opacity: .9; }
  .hover-piece { fill: none; stroke: var(--fg); stroke-width: 5; stroke-opacity: .35; stroke-linecap: round; pointer-events: none; }
  .candidate { padding: 4px 6px; border-radius: 4px; cursor: pointer; border-left: 3px solid transparent; }
  .candidate:hover, .candidate.on { background: var(--grid); }
  .candidate .route { color: var(--muted); font-size: 11px; }
  .back { color: var(--accent); cursor: pointer; display: block; margin-bottom: 6px; }
  kbd { font: 11px monospace; border: 1px solid var(--grid); border-radius: 3px; padding: 0 3px; }
</style>
</head>
<body>
<header><h1 id="title"></h1><p id="subtitle"></p></header>
<div id="plot"><div id="tip"></div></div>
<aside>
  <h2 id="panel-title">Selection</h2>
  <div id="details"></div>
  <h2>First … last train (hover to highlight, click to hide)</h2>
  <div id="groups"></div>
  <h2>Reading the plot</h2>
  <div id="legend"></div>
</aside>
<script>
const D = /*__DATA__*/null;
const NS = "http://www.w3.org/2000/svg";
const plotEl = document.getElementById("plot");
const tip = document.getElementById("tip");
const details = document.getElementById("details");
const panelTitle = document.getElementById("panel-title");
const timeFmt = new Intl.DateTimeFormat(undefined, { hour: "2-digit", minute: "2-digit", hourCycle: "h23", timeZone: D.tz });
const color = g => `hsl(${(g * 137.508) % 360}, 70%, 48%)`;
const HINT = "Hover a line to see which connections use it. Click it to select: a line used by one connection " +
  "selects that connection, a shared line lists all connections using it.";

// Interaction state. Selection only changes on click; hovering only previews.
const hidden = new Set();   // hidden groups
let pinned = null;          // selected connection
let candidates = null;      // connections using the clicked line: { piece, chains }
let hoverTarget = null;     // line under the mouse: { info, chains, pts }
let preview = null;         // connection hovered in the candidate list
let softGroup = null;       // group hovered in the group list

document.getElementById("title").textContent = D.title;
document.getElementById("subtitle").textContent = D.subtitle;
document.getElementById("legend").innerHTML =
  `x: time (${D.tz}). y: ${D.metric} (${D.unit}), goal at the bottom.<br>` +
  `Thick coloured: riding · thin grey: waiting (red: below minimum transfer) · dotted: walking.<br>` +
  `Parallel lines: same route later. Steeper: faster. Dashed orange: fallbacks of the selection.<br>` +
  `<kbd>↑</kbd> <kbd>↓</kbd> step through listed connections, <kbd>Esc</kbd> clears the selection.`;

function el(name, attrs, parent) {
  const e = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}
function esc(s) {
  return s.replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
}

// Points come as (unix minutes, height × 100, station); pieces and fallbacks by index.
for (const p of D.pieces) p.pts = p.pts.map(([m, h, s]) => [m * 60e3, h / 100, s]);
for (const f of D.fallbacks) f.pieces = f.pieces.map(i => D.pieces[i]);
for (const c of D.chains) c.fallbacks = c.fallbacks.map(([i, arrive]) => ({ ...D.fallbacks[i], arrive }));

// Domain over the connections; fallbacks reaching beyond are clipped.
let t0 = Infinity, t1 = -Infinity, y1 = 0;
for (const c of D.chains) for (const i of c.pieces)
  for (const [t, y] of D.pieces[i].pts) { t0 = Math.min(t0, t); t1 = Math.max(t1, t); y1 = Math.max(y1, y); }
const pad = 10 * 60e3; t0 -= pad; t1 += pad;

let view = null; // per-render drawing context

function render() {
  plotEl.querySelectorAll("svg").forEach(s => s.remove());
  const W = plotEl.clientWidth, H = plotEl.clientHeight;
  const m = { l: 240, r: 16, t: 14, b: 28 };
  const x = t => m.l + (t - t0) / (t1 - t0) * (W - m.l - m.r);
  const y = v => m.t + (y1 - v) / (y1 || 1) * (H - m.t - m.b);
  const svg = el("svg", { width: W, height: H });
  plotEl.insertBefore(svg, tip);
  const clip = el("clipPath", { id: "area" }, el("defs", {}, svg));
  el("rect", { x: m.l, y: 0, width: W - m.l - m.r, height: H - m.b }, clip);

  // Station bands, alternating hue, so neighbouring stations are told apart.
  const hue = i => (i * 47) % 360;
  const st = D.stations.map(s => ({ ...s, py: y(s.y) }));
  st.forEach((s, i) => {
    const above = i > 0 ? (st[i - 1].py + s.py) / 2 : m.t;
    const below = i < st.length - 1 ? (s.py + st[i + 1].py) / 2 : H - m.b;
    el("rect", { x: m.l, y: above, width: W - m.l - m.r, height: Math.max(0, below - above),
                 fill: `hsl(${hue(i)}, 60%, 50%)`, "fill-opacity": 0.05 }, svg);
  });

  // Every station gets a label: labels of nearby stations are pushed apart
  // and joined to their row by a leader line in the row's band colour.
  const gap = Math.min(12, (H - m.t - m.b) / Math.max(1, st.length));
  const at = st.map(s => s.py);
  for (let i = 1; i < at.length; i++) at[i] = Math.max(at[i], at[i - 1] + gap);
  if (at.length && at[at.length - 1] > H - m.b) {
    at[at.length - 1] = H - m.b;
    for (let i = at.length - 2; i >= 0; i--) at[i] = Math.min(at[i], at[i + 1] - gap);
  }
  const stations = el("g", { class: "station" }, svg);
  st.forEach((s, i) => {
    el("line", { x1: m.l, x2: W - m.r, y1: s.py, y2: s.py }, stations);
    el("polyline", { points: `${m.l - 26},${at[i]} ${m.l - 8},${s.py} ${m.l},${s.py}`, class: "leader",
                     stroke: `hsl(${hue(i)}, 60%, 50%)` }, stations);
    const t = el("text", { x: m.l - 30, y: at[i] + gap / 3, "text-anchor": "end",
                           "font-size": Math.min(11, gap) }, stations);
    t.textContent = s.name.length > 32 ? s.name.slice(0, 31) + "…" : s.name;
    el("title", {}, t).textContent = s.name;
  });

  const axis = el("g", { class: "axis" }, svg);
  const hour = 3600e3;
  const step = (t1 - t0) / hour > 30 ? 3 * hour : (t1 - t0) / hour > 14 ? 2 * hour : hour;
  for (let t = Math.ceil(t0 / hour) * hour; t <= t1; t += step) {
    el("line", { x1: x(t), x2: x(t), y1: m.t, y2: H - m.b }, axis);
    el("text", { x: x(t), y: H - 10, "text-anchor": "middle" }, axis).textContent = timeFmt.format(t);
  }

  const pts = p => p.pts.map(([t, v]) => `${x(t).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const lines = el("g", { "clip-path": "url(#area)" }, svg);
  const chainEls = D.chains.map((c, i) => {
    const g = el("g", { class: "chain" + (hidden.has(c.group) ? " off" : "") }, lines);
    for (const pi of c.pieces) {
      const p = D.pieces[pi];
      const line = el("polyline", { points: pts(p), class: p.kind + (p.warn ? " warn" : "") }, g);
      if (p.kind === "ride") line.setAttribute("stroke", color(c.group));
    }
    return g;
  });

  // Hover targets on the smallest shared units, so every connection passing
  // through counts, wherever it boards or leaves:
  //   rides: one per train and stop-to-stop stretch,
  //   waits: by station and time under the mouse,
  //   walks: per walk.
  const tAt = px => t0 + (px - m.l) / (W - m.l - m.r) * (t1 - t0);
  const edges = new Map(), waits = new Map(), walks = new Map();
  D.chains.forEach((c, i) => {
    if (hidden.has(c.group)) return;
    for (const pi of c.pieces) {
      const p = D.pieces[pi];
      if (p.kind === "ride") {
        for (let k = 1; k < p.pts.length; k++) {
          const [a, b] = [p.pts[k - 1], p.pts[k]];
          const key = `${p.trip}:${a[0]}:${a[2]}:${b[0]}:${b[2]}`;
          if (!edges.has(key)) {
            const info = a[2] === b[2]
              ? `${D.trips[p.trip]} · stop at ${D.names[a[2]]} ${timeFmt.format(a[0])}–${timeFmt.format(b[0])}`
              : `${D.trips[p.trip]} · ${timeFmt.format(a[0])} ${D.names[a[2]]} → ${timeFmt.format(b[0])} ${D.names[b[2]]}`;
            edges.set(key, { pts: [a, b], info, chains: new Set() });
          }
          edges.get(key).chains.add(i);
        }
      } else if (p.kind === "wait" && p.pts.length) {
        const s = p.pts[0][2];
        if (!waits.has(s)) waits.set(s, { spans: [], pieces: new Set() });
        waits.get(s).spans.push({ from: p.pts[0][0], to: p.pts[p.pts.length - 1][0], chain: i });
        waits.get(s).pieces.add(pi);
      } else if (p.kind === "walk") {
        if (!walks.has(pi)) walks.set(pi, new Set());
        walks.get(pi).add(i);
      }
    }
  });
  const hits = el("g", {}, svg);
  const target = (points, hover) => {
    const h = el("polyline", { points, class: "hit" }, hits);
    h.addEventListener("mousemove", e => { hoverTarget = hover(e); refresh(); moveTip(e); });
    h.addEventListener("mouseleave", () => { hoverTarget = null; refresh(); });
    h.addEventListener("click", e => { e.stopPropagation(); choose(hover(e)); });
  };
  for (const edge of edges.values()) {
    const t = { info: edge.info, chains: [...edge.chains], pts: edge.pts };
    target(pts(t), () => t);
  }
  for (const [s, { spans, pieces }] of waits) {
    for (const pi of pieces) {
      target(pts(D.pieces[pi]), e => {
        const at = tAt(e.clientX - svg.getBoundingClientRect().left);
        const chains = [...new Set(spans.filter(w => w.from <= at && at <= w.to).map(w => w.chain))];
        return { info: `waiting at ${D.names[s]} · ${timeFmt.format(at)}`, chains, pts: D.pieces[pi].pts };
      });
    }
  }
  for (const [pi, chains] of walks) {
    const t = { info: D.pieces[pi].info, chains: [...chains], pts: D.pieces[pi].pts };
    target(pts(t), () => t);
  }
  const hoverLayer = el("g", { "clip-path": "url(#area)" }, svg);
  const fbLayer = el("g", { class: "fallback", "clip-path": "url(#area)" }, svg);
  const labels = el("g", { class: "change-labels" }, svg);
  svg.addEventListener("click", () => { pinned = null; candidates = null; refresh(); });

  view = { svg, x, y, pts, lines, chainEls, hoverLayer, fbLayer, labels };
  refresh();
}

// Clicking a line: one connection selects it, several are listed to choose from.
function choose(target) {
  if (!target.chains.length) return;
  if (target.chains.length === 1) { candidates = null; pinned = target.chains[0]; }
  else { candidates = { info: target.info, chains: target.chains }; pinned = target.chains.includes(pinned) ? pinned : null; }
  refresh();
}

function refresh() {
  if (!view) return;
  const { svg, x, y, pts, lines, chainEls, hoverLayer, fbLayer, labels } = view;
  const strong = new Set([pinned, preview].filter(i => i !== null));
  const soft = new Set();
  if (hoverTarget) hoverTarget.chains.forEach(i => soft.add(i));
  if (candidates) candidates.chains.forEach(i => soft.add(i));
  if (softGroup !== null) D.chains.forEach((c, i) => { if (c.group === softGroup) soft.add(i); });

  svg.classList.toggle("focus", strong.size > 0 || soft.size > 0);
  chainEls.forEach((g, i) => {
    g.classList.toggle("hl", strong.has(i));
    g.classList.toggle("soft", soft.has(i) && !strong.has(i));
  });
  for (const i of soft) lines.appendChild(chainEls[i]);
  for (const i of strong) lines.appendChild(chainEls[i]);

  hoverLayer.replaceChildren();
  if (hoverTarget) el("polyline", { points: pts(hoverTarget), class: "hover-piece" }, hoverLayer);

  fbLayer.replaceChildren();
  labels.replaceChildren();
  const focus = preview ?? pinned;
  if (focus !== null) {
    if (focus === pinned) for (const f of D.chains[pinned].fallbacks) {
      const g = el("g", {}, fbLayer);
      for (const p of f.pieces) el("polyline", { points: pts(p), class: p.kind }, g);
    }
    // Name the changes: their station rows are often too close to tell apart.
    for (const p of D.chains[focus].pieces.map(i => D.pieces[i]).filter(p => p.kind === "wait" && p.pts.length)) {
      const [t, v] = p.pts[0];
      el("text", { x: x(t) + 4, y: y(v) - 5 }, labels).textContent = p.info;
    }
  }

  if (hoverTarget) {
    const { info, chains } = hoverTarget;
    let who;
    if (chains.length === 1) {
      const c = D.chains[chains[0]];
      who = `<br><b>${esc(c.header)}</b><span style="color:var(--muted)">${esc(c.route)}</span>`;
    } else {
      const groups = new Map();
      for (const i of chains) groups.set(D.chains[i].group, (groups.get(D.chains[i].group) || 0) + 1);
      const list = [...groups].sort((a, b) => b[1] - a[1])
        .map(([g, n]) => `<span style="color:${color(g)}">■</span> ${esc(D.groups[g].label)} (${n})`).join("<br>");
      who = `<br><span style="color:var(--muted)">${chains.length} connections in ${groups.size} group${groups.size > 1 ? "s" : ""} · click to list them</span><br>${list}`;
    }
    tip.innerHTML = `<b>${esc(info)}</b>${who}`;
    tip.style.display = "block";
  } else {
    tip.style.display = "none";
  }
  renderPanel();
}

function moveTip(e) {
  const r = plotEl.getBoundingClientRect();
  tip.style.left = Math.min(e.clientX - r.left + 14, r.width - tip.offsetWidth - 8) + "px";
  tip.style.top = (e.clientY - r.top + 14) + "px";
}

let panelKey = null; // avoid rebuilding the panel (and losing its hover) on every mouse move
function renderPanel() {
  const key = JSON.stringify([pinned, candidates && candidates.info, candidates && candidates.chains.length]);
  if (key === panelKey) return;
  panelKey = key;
  if (pinned !== null) {
    panelTitle.textContent = "Selected connection";
    const c = D.chains[pinned];
    let html = candidates
      ? `<span class="back" id="back">← ${candidates.chains.length} connections using ${esc(candidates.info)}</span>`
      : "";
    html += `<b>${esc(c.header)}</b>\n${esc(c.route).replaceAll(" ‖", "\n‖").replaceAll("‖ ", "‖\n")}`;
    let at = null;
    for (const f of c.fallbacks) {
      if (f.at !== at) { html += `\n\n<span class="fb">If the change at ${esc(f.at)} is missed:</span>`; at = f.at; }
      html += `\n<span class="fb">• ${esc(f.line)} · arrive ${esc(f.arrive)}</span>`;
    }
    details.innerHTML = html;
    document.getElementById("back")?.addEventListener("click", () => { pinned = null; refresh(); });
  } else if (candidates) {
    panelTitle.textContent = `${candidates.chains.length} connections use ${candidates.info}`;
    details.replaceChildren();
    for (const i of candidates.chains) {
      const c = D.chains[i];
      const row = document.createElement("div");
      row.className = "candidate";
      row.style.borderLeftColor = color(c.group);
      row.innerHTML = `<b>${esc(c.header)}</b><div class="route">${esc(c.route)}</div>`;
      row.addEventListener("mouseenter", () => { preview = i; refresh(); });
      row.addEventListener("mouseleave", () => { preview = null; refresh(); });
      row.addEventListener("click", () => { preview = null; pinned = i; refresh(); });
      details.appendChild(row);
    }
  } else {
    panelTitle.textContent = "Selection";
    details.textContent = HINT;
  }
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape") { pinned = null; candidates = null; preview = null; refresh(); return; }
  if (!candidates || (e.key !== "ArrowDown" && e.key !== "ArrowUp")) return;
  e.preventDefault();
  const list = candidates.chains;
  const now = list.indexOf(pinned);
  const next = now < 0 ? 0 : (now + (e.key === "ArrowDown" ? 1 : list.length - 1)) % list.length;
  pinned = list[next];
  refresh();
});

const groupsEl = document.getElementById("groups");
D.groups.forEach((g, i) => {
  const row = document.createElement("div");
  row.className = "group";
  row.innerHTML = `<span class="swatch" style="background:${color(i)}"></span><span>${esc(g.label)}</span><span class="count">${g.count}</span>`;
  row.addEventListener("mouseenter", () => { softGroup = hidden.has(i) ? null : i; refresh(); });
  row.addEventListener("mouseleave", () => { softGroup = null; refresh(); });
  row.addEventListener("click", () => {
    hidden.has(i) ? hidden.delete(i) : hidden.add(i);
    row.classList.toggle("off", hidden.has(i));
    softGroup = null;
    if (pinned !== null && D.chains[pinned].group === i) pinned = null;
    if (candidates) {
      candidates.chains = candidates.chains.filter(c => !hidden.has(D.chains[c].group));
      if (!candidates.chains.length) candidates = null;
    }
    panelKey = null;
    render();
  });
  groupsEl.appendChild(row);
});

new ResizeObserver(render).observe(plotEl);
</script>
</body>
</html>
