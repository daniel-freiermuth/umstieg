<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>umstieg · search</title>
<style>
  :root { --bg: #fff; --fg: #1d2129; --muted: #6b7280; --grid: #e5e7eb; --panel: #f8fafc; --accent: #d97706; --warn: #dc2626; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --fg: #e5e7eb; --muted: #9ca3af; --grid: #2a2f37; --panel: #181c22; --accent: #f59e0b; --warn: #f87171; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 18px; }
  fieldset { border: 1px solid var(--grid); border-radius: 8px; padding: 10px 14px 6px; margin: 0 0 14px; background: var(--panel); }
  legend { font-weight: 600; padding: 0 6px; }
  details > summary { cursor: pointer; font-weight: 600; margin: 4px 0 8px; }
  .field { display: grid; grid-template-columns: 170px 1fr; gap: 4px 12px; align-items: start; margin: 0 0 10px; }
  .field label { padding-top: 5px; }
  .field .help { grid-column: 2; color: var(--muted); font-size: 12px; }
  input[type=text], input[type=number], input[type=datetime-local], select {
    font: inherit; width: 100%; padding: 5px 8px; border: 1px solid var(--grid); border-radius: 5px; background: var(--bg); color: var(--fg); }
  input[type=checkbox] { margin-top: 8px; }
  .error { white-space: pre-wrap; color: var(--warn); border: 1px solid var(--warn); border-radius: 6px; padding: 8px 10px; margin: 0 0 14px; font-family: monospace; font-size: 12px; }
  button { font: inherit; font-weight: 600; padding: 8px 18px; border-radius: 6px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
  .note { color: var(--muted); font-size: 12px; margin-top: 10px; }
</style>
</head>
<body>
<main>
<h1>umstieg</h1>
<p class="lead">Every connection within your limits, including those journey planners hide.</p>
<div id="error" class="error" hidden></div>
<form id="form" action="/search" method="get"></form>
</main>
<script>
const SPEC = /*__SPEC__*/null;
const form = document.getElementById("form");
if (SPEC.error) Object.assign(document.getElementById("error"), { textContent: SPEC.error, hidden: false });

// Where fields go: the trip first, then limits, the rest folded away.
const TRIP = ["from", "to", "at", "window", "via"];
const label = name => name.replace(/_/g, " ").replace(/^./, c => c.toUpperCase());
const pad = n => String(n).padStart(2, "0");
const now = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };

function field(f) {
  const row = document.createElement("div");
  row.className = "field";
  const id = `f-${f.name}`;
  const has = Object.hasOwn(SPEC.values, f.name);
  const value = has ? SPEC.values[f.name] : f.default;
  let input;
  if (f.kind === "flag") {
    input = Object.assign(document.createElement("input"), { type: "checkbox", checked: has });
  } else if (f.kind === "choice") {
    input = document.createElement("select");
    for (const c of f.choices) input.append(new Option(c, c, false, c === value));
  } else {
    input = document.createElement("input");
    input.type = f.kind === "number" ? "number" : f.kind === "time" ? "datetime-local" : "text";
    if (f.kind === "number") input.step = "any";
    input.value = f.kind === "time" && !has ? now() : value;
    if (f.kind === "station" || f.kind === "stations") stationInput(input, f.kind === "stations");
    if (f.kind === "station") input.required = true;
    if (f.kind === "stations") input.placeholder = "Several separated by ;";
  }
  Object.assign(input, { id, name: f.name });
  const l = Object.assign(document.createElement("label"), { htmlFor: id, textContent: label(f.name) });
  const help = Object.assign(document.createElement("div"), { className: "help", textContent: f.help });
  row.append(l, input, help);
  return row;
}

// Station names complete from Transitous, the part after the last ";" for lists.
let lists = 0;
function stationInput(input, several) {
  const list = Object.assign(document.createElement("datalist"), { id: `stops-${lists++}` });
  input.setAttribute("list", list.id);
  input.autocomplete = "off";
  document.body.append(list);
  let timer = null, prefix = "";
  input.addEventListener("input", () => {
    clearTimeout(timer);
    const parts = input.value.split(";");
    const q = (several ? parts[parts.length - 1] : input.value).trim();
    prefix = several ? parts.slice(0, -1).map(s => s.trim()).filter(Boolean).map(s => s + "; ").join("") : "";
    if (q.length < 3) return;
    timer = setTimeout(async () => {
      const r = await fetch(`/stops?q=${encodeURIComponent(q)}`);
      if (!r.ok) return;
      list.replaceChildren(...(await r.json()).map(n => new Option(prefix + n)));
    }, 250);
  });
}

const trip = document.createElement("fieldset");
trip.append(Object.assign(document.createElement("legend"), { textContent: "Trip" }));
const limits = document.createElement("fieldset");
limits.append(Object.assign(document.createElement("legend"), { textContent: "Limits and display" }));
const advanced = document.createElement("details");
advanced.append(Object.assign(document.createElement("summary"), { textContent: "Advanced" }));
for (const name of TRIP) { const f = SPEC.fields.find(f => f.name === name); if (f) trip.append(field(f)); }
for (const f of SPEC.fields) {
  if (TRIP.includes(f.name)) continue;
  (f.advanced ? advanced : limits).append(field(f));
}
const submit = Object.assign(document.createElement("button"), { type: "submit", textContent: "Search" });
const note = Object.assign(document.createElement("p"), { className: "note",
  textContent: "A search takes from 20 seconds to a few minutes; repeating one within 10 minutes is fast (cached)." });
form.append(trip, limits, advanced, submit, note);
// Advanced settings that differ from the defaults stay visible.
if (SPEC.fields.some(f => f.advanced && Object.hasOwn(SPEC.values, f.name) && SPEC.values[f.name] !== f.default)) advanced.open = true;
// Only send what differs from the defaults: shorter links, same search.
form.addEventListener("submit", () => {
  for (const f of SPEC.fields) {
    const el = form.elements[f.name];
    if (f.kind !== "flag" && f.kind !== "station" && el.value === f.default) el.disabled = true;
  }
  setTimeout(() => { for (const el of form.elements) el.disabled = false; });
});
</script>
</body>
</html>
