[package]
name = "umstieg"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query", "gzip"] }
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
