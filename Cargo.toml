[package]
name = "umstieg"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json"] }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query", "gzip"] }
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
let_underscore_drop = "warn"
missing_debug_implementations = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Restriction lints worth having: no panicking shortcuts, no leftovers.
# Panics are for bugs only, and even then the code fails with an error
# instead: no unwrap/expect/panic/unreachable, no indexing or slicing, no
# arithmetic that can overflow or divide by zero.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
todo = "warn"
unimplemented = "warn"
panic_in_result_fn = "warn"
unwrap_in_result = "warn"
get_unwrap = "warn"
indexing_slicing = "warn"
string_slice = "warn"
arithmetic_side_effects = "warn"
integer_division = "warn"
integer_division_remainder_used = "warn"
exit = "warn"
dbg_macro = "warn"
print_stderr = "warn"
print_stdout = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
as_conversions = "allow"
undocumented_unsafe_blocks = "warn"
# A binary: the package metadata lints of `cargo` don't apply.
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "allow"
bare_urls = "warn"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
# A paused clock: rate limits are tested without waiting them out.
tokio = { version = "1.54.1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
