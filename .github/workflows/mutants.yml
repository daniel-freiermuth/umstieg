# Mutation gate for pull requests, informed by the diff: a mutant (a small
# change like `<` → `<=`) in a line the PR changes that no test notices fails
# the PR. Mutants in untouched code don't count. Rust: cargo-mutants; web:
# Stryker on the helper modules (the DOM scripts aren't mutated).
name: Mutants

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: cargo-mutants (PR diff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-mutants,cargo-nextest
      - run: just mutants-diff "origin/$GITHUB_BASE_REF"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutants.out
          path: mutants.out
          if-no-files-found: ignore

  web:
    name: Stryker (PR diff, web helpers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: npm ci
        working-directory: web
      - run: just web-mutants-diff "origin/$GITHUB_BASE_REF"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stryker-report
          path: web/reports/mutation
          if-no-files-found: ignore
