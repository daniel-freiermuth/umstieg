<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='15' fill='%23d97706' /><g fill='none' stroke='%23fff' stroke-linecap='round' stroke-linejoin='round'><path d='M10 42 L30 18 M28 50 L52 22' stroke-width='3' opacity='0.35' /><path d='M12 52 L24 36 H38 L52 14' stroke-width='5' /></g><circle cx='24' cy='36' r='4.5' fill='%23d97706' stroke='%23fff' stroke-width='3' /><circle cx='38' cy='36' r='4.5' fill='%23d97706' stroke='%23fff' stroke-width='3' /></svg>"
    />
    <title>umstieg · searching</title>
    <style>
      :root {
        --bg: #fff;
        --fg: #1d2129;
        --muted: #6b7280;
        --grid: #e5e7eb;
        --panel: #f8fafc;
        --accent: #d97706;
        --warn: #dc2626;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111418;
          --fg: #e5e7eb;
          --muted: #9ca3af;
          --grid: #2a2f37;
          --panel: #181c22;
          --accent: #f59e0b;
          --warn: #f87171;
        }
      }
      body {
        margin: 0;
        font:
          14px/1.45 system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 20px 16px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 12px;
      }
      pre {
        background: var(--panel);
        border: 1px solid var(--grid);
        border-radius: 8px;
        padding: 10px 12px;
        white-space: pre-wrap;
        font-size: 12px;
      }
      .error {
        color: var(--warn);
      }
      a {
        color: var(--accent);
      }
      #now {
        color: var(--muted);
        background: none;
        border: 0;
        padding: 0 12px;
        margin-top: -6px;
      }
      #now:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Searching…</h1>
      <pre id="log"></pre>
      <pre id="now"></pre>
      <p><a id="back" href="/">← Change search</a></p>
    </main>
    <script id="data" type="application/json">
      /*__DATA__*/
    </script>
    <script type="module">
      /*__SCRIPT__*/
    </script>
  </body>
</html>
