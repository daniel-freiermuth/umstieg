<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>umstieg · searching</title>
    <!--__HEAD__-->
    <style>
      body {
        min-height: 100vh;
      }
      main {
        width: min(640px, 100%);
        margin: 0 auto;
        padding: max(6vh, 24px) 16px 40px;
      }
      header {
        text-align: center;
        margin-bottom: 22px;
      }
      .card {
        padding: 20px 22px;
      }
      .head {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
      }
      h1 {
        font-size: 18px;
        margin: 0;
      }
      /* Turns while the search runs; gone once it is over. */
      .spinner {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
        border-radius: 50%;
        border: 2.5px solid color-mix(in srgb, var(--accent) 25%, transparent);
        border-top-color: var(--accent);
        animation: spin 0.9s linear infinite;
      }
      .over .spinner {
        display: none;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      pre {
        margin: 0;
        white-space: pre-wrap;
        font-size: 12px;
        line-height: 1.6;
      }
      #log {
        color: var(--muted);
      }
      #now {
        color: var(--fg);
        margin-top: 2px;
      }
      #now:empty {
        display: none;
      }
      .error,
      .report {
        margin-top: 10px;
        padding: 8px 10px;
        border: 1px solid var(--grid);
        border-radius: 8px;
      }
      .error {
        color: var(--warn);
        border-color: var(--warn);
      }
      .actions {
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid var(--grid);
      }
    </style>
  </head>
  <body>
    <main>
      <header><!--__BRAND__--></header>
      <div class="card">
        <div class="head">
          <div class="spinner"></div>
          <h1 id="title">Searching…</h1>
        </div>
        <pre id="log"></pre>
        <pre id="now"></pre>
        <div class="actions"><a id="back" class="btn" href="/">← Change search</a></div>
      </div>
    </main>
    <script id="data" type="application/json">
      /*__DATA__*/
    </script>
    <script type="module">
      /*__SCRIPT__*/
    </script>
  </body>
</html>
