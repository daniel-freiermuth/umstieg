<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>umstieg</title>
    <!--__HEAD__-->
    <style>
      body {
        font-size: 13px;
        line-height: 1.4;
        display: grid;
        grid-template-columns: 1fr 340px;
        grid-template-rows: auto 1fr;
        height: 100vh;
      }
      header {
        grid-column: 1 / 3;
        padding: 10px 16px;
        border-bottom: 1px solid var(--grid);
        display: flex;
        gap: 18px;
        align-items: center;
        background: color-mix(in srgb, var(--panel) 70%, transparent);
        backdrop-filter: blur(6px);
      }
      header .brand {
        padding-right: 18px;
        border-right: 1px solid var(--grid);
        align-self: stretch;
      }
      .titles {
        flex: 1;
        min-width: 0;
      }
      header h1 {
        font-size: 16px;
        margin: 0;
        letter-spacing: -0.01em;
      }
      header p {
        margin: 2px 0 0;
        color: var(--muted);
      }
      .controls {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-shrink: 0;
      }
      .controls label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
      }
      #plot {
        position: relative;
        background: var(--bg);
        overflow: hidden;
        cursor: grab;
        user-select: none;
        /* Touch pans and pinches the plot, not the page. */
        touch-action: none;
      }
      #plot:active {
        cursor: grabbing;
      }
      aside {
        border-left: 1px solid var(--grid);
        background: var(--panel);
        overflow: auto;
        padding: 12px 14px;
      }
      aside h2 {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin: 18px 0 8px;
        padding-top: 14px;
        border-top: 1px solid var(--grid);
      }
      aside h2:first-of-type {
        margin-top: 4px;
        padding-top: 0;
        border-top: 0;
      }
      .group {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 2px 4px;
        border-radius: 4px;
        cursor: pointer;
      }
      .group:hover {
        background: var(--grid);
      }
      .group.off {
        opacity: 0.35;
      }
      .count {
        margin-left: auto;
        color: var(--muted);
      }
      #details {
        white-space: pre-wrap;
        font-size: 12px;
      }
      #details .fb {
        color: var(--accent);
      }
      .pick {
        display: flex;
        gap: 6px;
        align-items: baseline;
        padding: 4px 8px;
        margin-bottom: 4px;
        border-radius: 8px;
        border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--grid));
        background: color-mix(in srgb, var(--accent) 10%, var(--bg));
        font-size: 12px;
        cursor: pointer;
      }
      .pick .x {
        margin-left: auto;
        color: var(--muted);
      }
      .pick:hover .x {
        color: var(--warn);
      }
      .pick-hint {
        color: var(--muted);
        font-size: 11px;
        margin: 2px 0 4px;
      }
      #tip {
        position: absolute;
        pointer-events: none;
        background: var(--panel);
        border: 1px solid var(--grid);
        border-radius: 10px;
        padding: 8px 10px;
        max-width: 560px;
        font-size: 12px;
        display: none;
        box-shadow: var(--shadow);
      }
      #tip b {
        display: block;
      }
      svg {
        display: block;
      }
      .axis text,
      .station text {
        fill: var(--muted);
        font-size: 11px;
      }
      .axis line {
        stroke: var(--grid);
      }
      .station line {
        stroke: var(--grid);
        stroke-dasharray: 2 3;
      }
      .station .leader {
        fill: none;
        stroke-width: 1;
      }
      .station .station-name {
        cursor: pointer;
      }
      .station .station-name:hover {
        fill: var(--fg);
      }
      /* Base: every stretch drawn once, rides coloured by train. */
      .base .ride,
      .overlay .ride {
        fill: none;
        stroke-width: 1.8;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .base .wait,
      .overlay .wait {
        fill: none;
        stroke: var(--wait);
        stroke-width: 1;
      }
      .base .warn,
      .overlay .warn {
        stroke: var(--warn);
      }
      .base .walk,
      .overlay .walk {
        fill: none;
        stroke: var(--wait);
        stroke-width: 1;
        stroke-dasharray: 3 3;
      }
      svg.focus .base {
        opacity: 0.15;
      }
      /* Overlay: the previewed connections, and the selected one thick. */
      .overlay .ride {
        stroke-width: 2.4;
      }
      .overlay .wait,
      .overlay .walk {
        stroke-width: 1.6;
      }
      .overlay .strong.ride {
        stroke-width: 4.5;
      }
      .overlay .strong.wait {
        stroke-width: 3;
      }
      /* Other listed connections recede behind the selected / previewed one. */
      .overlay .faded {
        opacity: 0.3;
      }
      .overlay,
      .fallback,
      .change-labels {
        pointer-events: none;
      }
      .fallback .ride {
        fill: none;
        stroke-width: 2.5;
        stroke-dasharray: 7 4;
      }
      .fallback .wait,
      .fallback .walk {
        fill: none;
        stroke: var(--accent);
        stroke-width: 1.5;
        stroke-dasharray: 2 3;
      }
      .fallback .warn {
        stroke: var(--warn);
      }
      .hit {
        fill: none;
        stroke: transparent;
        stroke-width: 9;
        pointer-events: stroke;
      }
      .change-labels text {
        fill: var(--fg);
        font-size: 11px;
        paint-order: stroke;
        stroke: var(--bg);
        stroke-width: 3px;
      }
      .picked-piece {
        fill: none;
        stroke: var(--accent);
        stroke-width: 9;
        stroke-opacity: 0.45;
        stroke-linecap: round;
        pointer-events: none;
      }
      .hover-piece {
        fill: none;
        stroke: var(--fg);
        stroke-width: 7;
        stroke-opacity: 0.3;
        stroke-linecap: round;
        pointer-events: none;
      }
      .candidate {
        padding: 4px 6px;
        border-radius: 4px;
        cursor: pointer;
      }
      .candidate .unlisted {
        color: var(--muted);
        font-size: 11px;
      }
      .candidate:hover,
      .candidate.on {
        background: var(--grid);
      }
      .candidate .route {
        color: var(--muted);
        font-size: 11px;
      }
      .back {
        color: var(--accent);
        cursor: pointer;
        display: block;
        margin-bottom: 6px;
      }
      /* Phones: the plot over the lists, the page scrolls. */
      @media (max-width: 760px) {
        body {
          grid-template-columns: 1fr;
          grid-template-rows: auto 65vh auto;
          height: auto;
        }
        header {
          grid-column: 1;
          flex-wrap: wrap;
          gap: 8px 14px;
        }
        header .brand {
          border-right: 0;
          padding-right: 0;
        }
        .titles {
          flex-basis: 100%;
          order: 1;
        }
        .controls {
          flex-wrap: wrap;
          flex-basis: 100%;
          order: 2;
        }
        aside {
          border-left: 0;
          border-top: 1px solid var(--grid);
          overflow: visible;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <!--__BRAND__-->
      <div class="titles">
        <h1 id="title"></h1>
        <p id="subtitle"></p>
      </div>
      <div class="controls">
        <a id="new-search" class="btn" hidden>← Change search</a>
        <label
          >Height
          <select id="metric"></select
        ></label>
        <button id="reset" class="btn" title="Or double-click the plot">Reset zoom</button>
      </div>
    </header>
    <div id="plot"><div id="tip"></div></div>
    <aside>
      <div id="picks"></div>
      <h2 id="panel-title">Selection</h2>
      <div id="details"></div>
      <h2>First … last train (hover to highlight, click to hide)</h2>
      <div id="groups"></div>
      <h2>Reading the plot</h2>
      <div id="legend"></div>
    </aside>
    <script id="data" type="application/json">
      /*__DATA__*/
    </script>
    <script type="module">
      /*__SCRIPT__*/
    </script>
  </body>
</html>
